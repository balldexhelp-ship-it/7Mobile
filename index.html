<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 7</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    background: #0078d7;
  }
  img.wallpaper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
  }

  /* Windows 8.1 style tile grid - bigger */
  .tile-grid {
    position: fixed;
    top: 20px;
    right: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 14px;
    width: 420px;
    height: 420px;
    z-index: 10;
  }

  .tile {
    border-radius: 4px;
  }

  /* Classic Windows 8.1 tile colors */
  .tile:nth-child(1) { background: #0078d7; }
  .tile:nth-child(2) { background: #00bcf2; }
  .tile:nth-child(3) { background: #107c10; }
  .tile:nth-child(4) { background: #ff8c00; }
  .tile:nth-child(5) { background: #e81123; }
  .tile:nth-child(6) { background: #b146c2; }
  .tile:nth-child(7) { background: #00b294; }
  .tile:nth-child(8) { background: #d83b01; }
  .tile:nth-child(9) { background: #5c2d91; }
</style>
</head>
<body>
  <img class="wallpaper" src="https://archive.org/download/ms-windows-7-wallpapers/img0.jpg" alt="Windows 7 Wallpaper">
  
  <div class="tile-grid">
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
  </div>
</body>
</html>
